name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Fast Android APK Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup & Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 📦 Install Dependencies (Fast Cache)
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: 🏗️ Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Set gradlew permissions
        run: chmod +x android/gradlew

      - name: ⚡ Build Fast Android APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            --configure-on-demand \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AfroCuisto-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
