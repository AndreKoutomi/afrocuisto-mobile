name: Build & Deploy to Firebase App Distribution

on:
  push:
    branches:
      - beta
      - Beta
      - production
      - Production
      - main
  workflow_dispatch:
    inputs:
      branch_target:
        description: 'Target Environment'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production

jobs:
  build-and-distribute:
    name: Build & Distribute Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Versioning & Environment
        id: env_config
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.branch_target }}"
          elif [ "$REF_NAME" = "production" ] || [ "$REF_NAME" = "Production" ]; then
            TARGET_ENV="production"
          else
            TARGET_ENV="beta"
          fi

          APP_VER="1.1.0"
          BUILD_NUM="${{ github.run_number }}"

          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV

      - name: Configure Keystore & Signing
        working-directory: afrocuisto-android
        run: |
          mkdir -p app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom Keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "Generating automated Keystore..."
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore app/release.keystore \
              -alias afrocuisto-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass afrocuisto123 \
              -keypass afrocuisto123 \
              -dname "CN=AfroCuisto, OU=Mobile, O=AfroCuisto, L=Paris, S=IDF, C=FR"
            KEYSTORE_PASS="afrocuisto123"
            KEY_ALIAS="afrocuisto-release"
            KEY_PASS="afrocuisto123"
          fi

          {
            echo ""
            echo "AFROCUISTO_RELEASE_STORE_FILE=release.keystore"
            echo "AFROCUISTO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "AFROCUISTO_RELEASE_STORE_PASSWORD=$KEYSTORE_PASS"
            echo "AFROCUISTO_RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> gradle.properties

      - name: Set gradlew permissions
        working-directory: afrocuisto-android
        run: chmod +x ./gradlew

      - name: Build Standalone Android Release APK
        working-directory: afrocuisto-android
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_OTA_URL: ${{ secrets.FIREBASE_OTA_URL }}
        run: |
          ./gradlew assembleRelease \
            -x lintVitalRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            -PAFROCUISTO_VERSION_CODE=${{ env.BUILD_NUMBER }} \
            -PAFROCUISTO_VERSION_NAME=${{ env.APP_VERSION }} \
            -PAFROCUISTO_APP_ENV=${{ env.TARGET_ENV }} \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"

      - name: Prepare & Rename APK Artifact
        run: |
          mkdir -p build-output
          find afrocuisto-android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build-output/AfroCuisto-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}.apk \;
          echo "Generated APK:"
          ls -la build-output/

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AfroCuisto-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          path: build-output/*.apk
          retention-days: 14

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.TARGET_ENV == 'production' && secrets.FIREBASE_APP_ID || '1:983989027916:android:27120d6e848c4a164c60e9' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ env.TARGET_ENV == 'production' && 'production-testers' || 'beta-testers' }}
          file: build-output/AfroCuisto-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}.apk
          releaseNotes: |
            AfroCuisto [${{ env.TARGET_ENV }}] — v${{ env.APP_VERSION }} (Build #${{ env.BUILD_NUMBER }})
            Refonte UI Solar & 28.dp, Chef IA vocal temps réel, Mon Marché, Communauté plein écran, Profil modulaire, et navigation 120 FPS.
            Branche: ${{ github.ref_name }} (${{ github.sha }})

      - name: Publish OTA APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          name: AfroCuisto ${{ env.TARGET_ENV }} v${{ env.APP_VERSION }} (#${{ env.BUILD_NUMBER }})
          prerelease: ${{ env.TARGET_ENV != 'production' }}
          files: build-output/AfroCuisto-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}.apk
          body: |
            Version ${{ env.APP_VERSION }} (Build #${{ env.BUILD_NUMBER }}) — Canal ${{ env.TARGET_ENV }}

      - name: Prepare Firebase Hosting OTA Manifests
        run: |
          APK_NAME="AfroCuisto-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}.apk"
          APK_SIZE=$(stat -c%s "build-output/${APK_NAME}")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/ota-${{ env.TARGET_ENV }}-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}/${APK_NAME}"

          mkdir -p firebase-hosting/ota/beta firebase-hosting/ota/production

          if [ "${{ env.TARGET_ENV }}" = "production" ]; then
            OTHER_ENV="beta"
          else
            OTHER_ENV="production"
          fi

          # Preserve the other environment's existing version.json from Firebase Hosting
          curl -fsSL "https://afrocuisto-b023d.web.app/ota/${OTHER_ENV}/version.json" -o "firebase-hosting/ota/${OTHER_ENV}/version.json" || true

          cat > "firebase-hosting/ota/${{ env.TARGET_ENV }}/version.json" <<EOF
          {
            "versionCode": ${{ env.BUILD_NUMBER }},
            "versionName": "${{ env.APP_VERSION }}",
            "apkUrl": "${APK_URL}",
            "sizeBytes": ${APK_SIZE},
            "releaseNotes": "AfroCuisto (${{ env.TARGET_ENV }}) v${{ env.APP_VERSION }} — Build #${{ env.BUILD_NUMBER }}"
          }
          EOF

      - name: Deploy OTA Manifest to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: afrocuisto-b023d
